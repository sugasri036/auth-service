apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: investra

spec:

  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:

    metadata:
      labels:
        app: auth-service

    spec:

      containers:

        - name: auth-service

          image: auth-service:local

          imagePullPolicy: IfNotPresent
          
          ports:
            - containerPort: 10000
              protocol: TCP

          env:

            # =================================================
            # APPLICATION
            # =================================================

            - name: PORT
              value: "10000"

            # =================================================
            # DATABASE
            # =================================================

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: DATABASE_URL

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: DB_PASSWORD

            # =================================================
            # JWT
            # =================================================

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: JWT_SECRET

            # =================================================
            # GOOGLE OAUTH
            # =================================================

            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: GOOGLE_CLIENT_ID

            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: GOOGLE_CLIENT_SECRET

            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: GOOGLE_REDIRECT_URI

            # =================================================
            # FRONTEND
            # =================================================

            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: FRONTEND_URL

            # =================================================
            # OTP SERVICE
            # =================================================

            - name: OTP_SERVICE_URL
              value: "http://otp-service:8084"

            # =================================================
            # EUREKA DISABLED
            # =================================================

            - name: EUREKA_ENABLED
              value: "false"

            - name: EUREKA_REGISTER
              value: "false"

            - name: EUREKA_FETCH
              value: "false"

          # ===================================================
          # HEALTH CHECKS
          # ===================================================

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 10000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 10000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # ===================================================
          # RESOURCE MANAGEMENT
          # ===================================================

          resources:

            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "768Mi"